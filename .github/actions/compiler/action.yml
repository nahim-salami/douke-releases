name: Compiler Douke
description: >
  Compile ce qui existe dans source/ : l'app Android (Expo, apps/mobile) et le site web
  (Next.js en export statique, apps/web). Les livrables sont rangés dans un dossier
  temporaire, jamais déposés comme artefact : seul le workflow « Publier » les met en ligne.

inputs:
  version:
    description: Numéro de version utilisé dans le nom des fichiers
    required: false
    default: dev
  signature-obligatoire:
    description: "« true » pour refuser un APK signé avec la clé de débogage"
    required: false
    default: "false"
  android-keystore-base64:
    description: Keystore de signature Android, en base 64
    required: false
    default: ""
  android-keystore-password:
    required: false
    default: ""
  android-key-alias:
    required: false
    default: ""
  android-key-password:
    required: false
    default: ""

outputs:
  dossier:
    description: Dossier des livrables
    value: ${{ steps.detecter.outputs.dossier }}
  nombre:
    description: Nombre de livrables produits
    value: ${{ steps.compter.outputs.nombre }}

runs:
  using: composite
  steps:
    - name: Détecter les applications
      id: detecter
      shell: bash
      run: |
        dossier="$RUNNER_TEMP/livrables"
        mkdir -p "$dossier"
        echo "dossier=$dossier" >> "$GITHUB_OUTPUT"
        mobile=false; web=false
        [ -f source/apps/mobile/package.json ] && mobile=true
        [ -f source/apps/web/package.json ] && web=true
        echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
        echo "web=$web" >> "$GITHUB_OUTPUT"
        if [ ! -f source/package-lock.json ] && { [ "$mobile" = true ] || [ "$web" = true ]; }; then
          echo "::error::Une application existe mais source/package-lock.json manque : impossible d'installer les dépendances."
          exit 1
        fi
        [ "$mobile" = true ] || echo "App mobile absente (apps/mobile) : compilation Android ignorée."
        [ "$web" = true ] || echo "Site web absent (apps/web) : compilation web ignorée."

    # --- Android ---------------------------------------------------------------
    - name: Installer Java 17
      if: steps.detecter.outputs.mobile == 'true'
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: 17
        # Pas de « cache: gradle » ici : le dossier android/ n'existe qu'après le prebuild.

    - name: Générer le projet Android
      if: steps.detecter.outputs.mobile == 'true'
      shell: bash
      working-directory: source/apps/mobile
      run: bash "$GITHUB_ACTION_PATH/../../scripts/discret.sh" "Android : prebuild Expo" npx expo prebuild --platform android --no-install --clean

    - name: Compiler l'APK
      if: steps.detecter.outputs.mobile == 'true'
      shell: bash
      working-directory: source/apps/mobile/android
      env:
        KEYSTORE_B64: ${{ inputs.android-keystore-base64 }}
        KEYSTORE_PASSWORD: ${{ inputs.android-keystore-password }}
        KEY_ALIAS: ${{ inputs.android-key-alias }}
        KEY_PASSWORD: ${{ inputs.android-key-password }}
        SIGNATURE_OBLIGATOIRE: ${{ inputs.signature-obligatoire }}
        VERSION: ${{ inputs.version }}
        DOSSIER: ${{ steps.detecter.outputs.dossier }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/douke.keystore"
          export KEYSTORE_FILE="$RUNNER_TEMP/douke.keystore"
          echo "Signature : keystore de production."
        elif [ "$SIGNATURE_OBLIGATOIRE" = "true" ]; then
          echo "::error::Version publique sans keystore : ajoute les secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS et ANDROID_KEY_PASSWORD."
          exit 1
        else
          echo "::warning::Pas de keystore : APK signé avec la clé de débogage, à ne pas distribuer."
        fi
        chmod +x gradlew
        # Le script passé en argument est entre apostrophes : les mots de passe ne sont
        # développés que dans le sous-shell, et n'apparaissent dans aucun journal.
        bash "$GITHUB_ACTION_PATH/../../scripts/discret.sh" "Android : compilation APK" bash -c '
          set -e
          args=()
          if [ -n "${KEYSTORE_FILE:-}" ]; then
            args+=("-Pandroid.injected.signing.store.file=$KEYSTORE_FILE"
                   "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD"
                   "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
                   "-Pandroid.injected.signing.key.password=$KEY_PASSWORD")
          fi
          ./gradlew assembleRelease --no-daemon --console=plain "${args[@]}"
        '
        rm -f "$RUNNER_TEMP/douke.keystore"
        cp app/build/outputs/apk/release/app-release.apk "$DOSSIER/douke-${VERSION}-android.apk"

    # --- Web -------------------------------------------------------------------
    - name: Compiler le site web
      if: steps.detecter.outputs.web == 'true'
      shell: bash
      working-directory: source
      env:
        VERSION: ${{ inputs.version }}
        DOSSIER: ${{ steps.detecter.outputs.dossier }}
      run: |
        bash "$GITHUB_ACTION_PATH/../../scripts/discret.sh" "Web : compilation" npm run build --workspace apps/web
        if [ -d apps/web/out ]; then
          (cd apps/web/out && zip -qr "$DOSSIER/douke-${VERSION}-web.zip" .)
        else
          echo "::notice::apps/web/out absent : pas d'export statique, rien à publier pour le web."
        fi

    # --- Bilan -----------------------------------------------------------------
    - name: Compter les livrables
      id: compter
      shell: bash
      env:
        DOSSIER: ${{ steps.detecter.outputs.dossier }}
      run: |
        nombre=$(find "$DOSSIER" -maxdepth 1 -type f | wc -l)
        echo "nombre=$nombre" >> "$GITHUB_OUTPUT"
        {
          echo ""
          echo "**Livrables : $nombre**"
          find "$DOSSIER" -maxdepth 1 -type f -printf -- '- %f (%k Ko)\n'
        } >> "$GITHUB_STEP_SUMMARY"
