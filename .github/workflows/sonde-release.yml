# Workflow temporaire de diagnostic : création d'un brouillon de release avec GITHUB_TOKEN.
name: Sonde release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  sonde:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          gh release create v0.0.0-sonde-a --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title sonde --notes sonde || echo "ECHEC sans fichier"
          echo test > sonde.txt
          gh release create v0.0.0-sonde-b sonde.txt --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title sonde --notes sonde || echo "ECHEC avec fichier"
          gh api "repos/$GITHUB_REPOSITORY/releases" -X POST -f tag_name=v0.0.0-sonde-c -f name=sonde -F draft=true || echo "ECHEC API directe"
          for t in a b c; do gh release delete "v0.0.0-sonde-$t" --repo "$GITHUB_REPOSITORY" --yes || true; done
